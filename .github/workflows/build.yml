# =============================================================================
#  DO NOT CREATE A MAIN RELEASE WITHOUT THE OWNER ASKING FOR IT, IN WRITING.
#
#  Pushing to `main` publishes only test APKs to the `continuous` pre-release
#  and (if small enough) to the `build` branch. A versioned `v*` tag creates a
#  versioned GitHub Release; creating that tag is the explicit release action.
#
#  A manually dispatched main release (a non-prerelease `v<version>` on the
#  releases page) is gated twice: the `release` checkbox AND the `confirm_release`
#  input, which must be typed as exactly  CONFIRM-RELEASE . If either is
#  missing the release step does not run; a warning step says so in the log.
#
#  Automation / coding agents: NEVER create version tags or dispatch this
#  workflow with release=true. Only the human owner may intentionally create a
#  version tag or request the separately gated manual release.
# =============================================================================
name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      release:
        description: "Create a main release (v<version>) from current main"
        type: boolean
        default: false
      confirm_release:
        description: "Safety gate: type CONFIRM-RELEASE (exactly) to actually publish a main release"
        type: string
        default: ""
      version:
        description: "Release version (e.g. 0.1.0); becomes the APK versionName"
        type: string
        default: "0.1.0"
      version_code:
        description: "Optional versionCode override; defaults to the Actions run number"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # A build that stalls (a Maven download that never lands) used to sit on
    # the runner for half an hour with no output. The per-attempt timeout in
    # the build step handles the common case; this is the backstop.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - name: Prepare signing keystore
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required signing secret $name is not configured."
              exit 1
            fi
          done
          KEYSTORE_PATH="$RUNNER_TEMP/hikari-s-signing.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error::The decoded signing keystore is empty."
            exit 1
          fi
          if ! keytool -list -keystore "$KEYSTORE_PATH" -storetype JKS \
            -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::The signing keystore, password, or alias could not be validated."
            exit 1
          fi
          if ! keytool -certreq -keystore "$KEYSTORE_PATH" -storetype JKS \
            -storepass:env KEYSTORE_PASSWORD -keypass:env KEY_PASSWORD \
            -alias "$KEY_ALIAS" -file "$RUNNER_TEMP/hikari-s-signing-probe.csr" >/dev/null 2>&1; then
            echo "::error::The signing key password could not be validated."
            exit 1
          fi
          rm -f "$RUNNER_TEMP/hikari-s-signing-probe.csr"
          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "Signing keystore and key entry validated."

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.11.1"
          # The GitHub cache service occasionally has outages that make the
          # restore/save steps exit 1 and kill the whole build before gradle
          # even runs. Disabling the cache costs a couple of minutes of
          # dependency re-downloads but makes builds deterministic.
          cache-disabled: true

      - name: Build APKs (debug + release)
        env:
          GIT_SHA: ${{ github.sha }}
          UPDATE_REPO: ${{ github.repository }}
          APP_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || (startsWith(github.ref, 'refs/tags/v') && github.ref_name || '') }}
          APP_VERSION_CODE: ${{ github.event_name == 'workflow_dispatch' && inputs.version_code || ((github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')) && github.run_number || '') }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [[ "$APP_VERSION" == v* ]]; then
            export APP_VERSION="${APP_VERSION#v}"
          fi
          if [[ -n "$APP_VERSION" && ! "$APP_VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version name must be a dotted numeric version, optionally with a prerelease suffix."
            exit 1
          fi
          if [[ -n "$APP_VERSION_CODE" && ! "$APP_VERSION_CODE" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Android versionCode must be a positive integer."
            exit 1
          fi
          # Maven Central occasionally rate-limits (HTTP 429) cold dependency
          # resolution. Retry the whole build a few times with a pause so the
          # rate-limit bucket can drain, instead of failing the first run.
          # Each attempt is capped as well as retried: a stalled download can
          # hang a Gradle build indefinitely (no output, no exit code), and
          # that is worse than a clean failure, because the retry never gets a
          # chance to run. "timeout" turns a hang into exit code 124, which the
          # retry below treats like any other transient network problem.
          # `set +e` is load-bearing: this step's shell runs with `-e` (see
          # `shell:` above), and a failing `timeout gradle…` would abort the
          # script at that line — before `code=$?`, before the retry, and before
          # the error dump below. That is why a failed build used to be logged
          # as "attempt 1/5" followed by nothing at all: the actual Kotlin
          # errors were in gradle-build.log, and the step never printed them.
          set +e
          code=1
          for attempt in 1 2 3 4 5; do
            echo "==== Gradle build attempt $attempt/5 ===="
            timeout 1500 gradle assembleDebug testDebugUnitTest assembleRelease --no-daemon --stacktrace \
              -Dorg.gradle.internal.http.connectionTimeout=30000 \
              -Dorg.gradle.internal.http.socketTimeout=60000 > gradle-build.log 2>&1
            code=$?
            if [ $code -eq 0 ]; then
              break
            fi
            if [ $code -eq 124 ] || grep -qE "429|Too Many Requests|Connection reset|Read timed out|SocketTimeout|connect timed out|Could not resolve|Unable to load Maven meta-data" gradle-build.log; then
              echo "==== Attempt $attempt hit a rate-limit or network stall (exit $code); retrying in 45s ===="
              sleep 45
            else
              echo "==== Attempt $attempt failed with a non-network error; stopping ===="
              break
            fi
          done
          if [ $code -ne 0 ]; then
            echo "==== BUILD FAILED (exit $code) ===="
            tail -n 200 gradle-build.log
            echo "==== KOTLIN ERRORS ===="
            grep -E "^e: " gradle-build.log | head -n 40
            grep -E "^e: " gradle-build.log | head -n 40 | sed -E 's/^e: (.+): \(([0-9]+), ([0-9]+)\): (.*)/::error file=\1,line=\2,col=\3::\4/' || true
          fi
          exit $code

      # ---- Split APKs: work out which files this build produced ----
      # The release build now emits one APK per phone processor
      # (`-armeabi-v7a-` = 32-bit arm, `-arm64-v8a-` = 64-bit arm) plus a
      # universal one carrying both, so the file names depend on the split
      # filter. This step resolves them once (into $GITHUB_ENV, so every step
      # below can use them) and dumps the build's own output-metadata.json into
      # the log, which is where the version code of each APK is recorded.
      - name: Collect release APKs
        run: |
          OUT=app/build/outputs/apk/release
          echo "==== release output files ===="
          ls -la "$OUT"
          echo "==== release output-metadata.json ===="
          cat "$OUT/output-metadata.json" 2>/dev/null || echo "(no output-metadata.json)"
          echo "==== debug output files ===="
          ls -la app/build/outputs/apk/debug 2>/dev/null || true
          APK_ARM64=$(ls "$OUT" 2>/dev/null | grep -E 'arm64-v8a.*\.apk$' | head -n1 || true)
          APK_ARM32=$(ls "$OUT" 2>/dev/null | grep -E 'armeabi-v7a.*\.apk$' | head -n1 || true)
          APK_UNIVERSAL=$(ls "$OUT" 2>/dev/null | grep -E 'universal.*\.apk$' | head -n1 || true)
          # Some AGP versions name the universal APK plainly app-release.apk;
          # accept that too so this step can never be what breaks a release.
          if [ -z "$APK_UNIVERSAL" ] && [ -f "$OUT/app-release.apk" ]; then
            APK_UNIVERSAL=app-release.apk
          fi
          {
            echo "APK_ARM64=$APK_ARM64"
            echo "APK_ARM32=$APK_ARM32"
            echo "APK_UNIVERSAL=$APK_UNIVERSAL"
          } >> "$GITHUB_ENV"
          echo "armv8=[$APK_ARM64] armv7=[$APK_ARM32] universal=[$APK_UNIVERSAL]"

      - name: Verify release APKs are signed and intact
        if: steps.signing.outputs.available == 'true'
        run: |
          if [ -z "$APK_UNIVERSAL" ]; then
            echo "::error::Release APK is missing or ABI splits did not produce a universal APK."
            exit 1
          fi
          EXPECTED_APP_ID=$(sed -n 's/^app.applicationId=//p' hikari-s.properties | head -n1)
          : > app/build/outputs/apk/release/SHA256SUMS.txt
          # One APK per processor type plus the universal one, each plausibly
          # sized, signed by Android's official apksigner, and intact.
          for f in "$APK_ARM64" "$APK_ARM32" "$APK_UNIVERSAL"; do
            if [ -z "$f" ]; then
              echo "::error::A release APK is missing - expected one per ABI plus a universal APK."
              exit 1
            fi
            size=$(stat -c%s "app/build/outputs/apk/release/$f")
            echo "$f = $size bytes"
            if [ "$size" -lt 1000000 ]; then
              echo "::error::$f is unexpectedly small."
              exit 1
            fi
            APK_PATH="app/build/outputs/apk/release/$f"
            if ! "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK_PATH" >/dev/null; then
              echo "::error::$f failed APK signature verification."
              exit 1
            fi
            APK_APP_ID=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK_PATH" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n1)
            if [ -z "$EXPECTED_APP_ID" ] || [ "$APK_APP_ID" != "$EXPECTED_APP_ID" ]; then
              echo "::error::$f applicationId does not match hikari-s.properties."
              exit 1
            fi
            sha256sum "$APK_PATH" >> app/build/outputs/apk/release/SHA256SUMS.txt
            echo "$f: signature verified, applicationId=$APK_APP_ID, $size bytes"
          done
          ls -la app/build/outputs/apk/release/

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: gradle-build.log
          if-no-files-found: ignore

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: hikari-s-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/SHA256SUMS.txt
          if-no-files-found: error

      # ---- TEST CHANNELS: updated on every push to main ----
      - name: Publish test APK to build branch
        if: github.ref == 'refs/heads/main' && steps.signing.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp "app/build/outputs/apk/release/$APK_UNIVERSAL" hikari-s.apk
          SIZE_MB=$(du -m hikari-s.apk | cut -f1)
          if [ "$SIZE_MB" -ge 100 ]; then
            echo "hikari-s.apk is ${SIZE_MB}MB - over GitHub's 100MB file limit, skipping build-branch push (the release APK is still in the artifacts)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin build >/dev/null 2>&1 && git checkout build 2>/dev/null || git checkout --orphan build
          cp "app/build/outputs/apk/release/$APK_UNIVERSAL" hikari-s.apk
          git add hikari-s.apk
          git commit -m "build: update test APK $(date -u +%Y%m%d%H%M)" || true
          git push origin build --force || { echo "build-branch push rejected (APK too large for GitHub's 100MB limit) - not fatal, release APK stays in artifacts."; exit 0; }

      - name: Publish test APK to continuous release
        if: github.ref == 'refs/heads/main' && steps.signing.outputs.available == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp "app/build/outputs/apk/release/$APK_UNIVERSAL" hikari-s-signed.apk
          cp "app/build/outputs/apk/release/$APK_ARM64" hikari-s-arm64-v8a.apk
          cp "app/build/outputs/apk/release/$APK_ARM32" hikari-s-armeabi-v7a.apk
          if gh release view continuous --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            for i in 1 2 3; do
              gh release upload continuous hikari-s-signed.apk hikari-s-arm64-v8a.apk hikari-s-armeabi-v7a.apk --repo "$GITHUB_REPOSITORY" --clobber && break
              echo "continuous upload attempt $i failed (often a transient race with a concurrent build), retrying..."
              sleep 5
            done
          else
            gh release create continuous hikari-s-signed.apk hikari-s-arm64-v8a.apk hikari-s-armeabi-v7a.apk --repo "$GITHUB_REPOSITORY" \
              --title "Continuous build" \
              --notes "Signed test APKs, auto-built from main. hikari-s-signed.apk is the universal build; the arm64-v8a / armeabi-v7a ones are smaller and for that processor type only." || true
          fi

      # ---- VERSIONED RELEASE: explicit v* tag, or gated manual dispatch ----
      # A plain push to main never creates a versioned release. The owner may
      # either create a v* tag or use the separately confirmed manual route.
      - name: Refuse unconfirmed main release
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true' && github.event.inputs.confirm_release != 'CONFIRM-RELEASE'
        run: |
          echo "::warning title=Main release refused::A main release was requested but NOT published: the 'confirm_release' input must be set to exactly CONFIRM-RELEASE. Nothing was released - the continuous pre-release is unaffected."

      - name: Publish versioned release
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true' && github.event.inputs.confirm_release == 'CONFIRM-RELEASE')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.version }}
        run: |
          VERSION="${RELEASE_VERSION#v}"
          TAG="v$VERSION"
          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release version must be a valid dotted version, or a v<version> tag must be used."
            exit 1
          fi
          cp "app/build/outputs/apk/release/$APK_UNIVERSAL" hikari-s.apk
          # Each release carries all three builds: the universal APK under the
          # name every existing link and the in-app updater already use, plus
          # the two processor-specific ones so a user can download the smaller
          # file that matches their phone.
          cp "app/build/outputs/apk/release/$APK_ARM64" hikari-s-arm64-v8a.apk
          cp "app/build/outputs/apk/release/$APK_ARM32" hikari-s-armeabi-v7a.apk
          # The release body is that version's own CHANGELOG.md section, so the
          # releases page and the changelog can never drift apart.
          NOTES=""
          if [ -f CHANGELOG.md ]; then
            NOTES=$(awk -v v="$VERSION" '$0 == "## " v {p=1; next} /^## / {p=0} p' CHANGELOG.md | sed -e 's/[[:space:]]*$//' | cat -s)
          fi
          if [ -z "$NOTES" ]; then
            NOTES="Signed release APK."
            echo "No CHANGELOG.md section found for $VERSION; using the default notes."
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            uploaded=0
            for i in 1 2 3; do
              if gh release upload "$TAG" hikari-s.apk hikari-s-arm64-v8a.apk hikari-s-armeabi-v7a.apk --repo "$GITHUB_REPOSITORY" --clobber; then
                uploaded=1
                break
              fi
              echo "release upload attempt $i failed (often a transient race with a concurrent build), retrying..."
              sleep 5
            done
            if [ "$uploaded" -ne 1 ]; then
              echo "::error::Could not upload all signed APKs to release $TAG."
              exit 1
            fi
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Hikari S $VERSION" --notes "$NOTES"
          else
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              gh release create "$TAG" hikari-s.apk hikari-s-arm64-v8a.apk hikari-s-armeabi-v7a.apk --repo "$GITHUB_REPOSITORY" \
                --verify-tag --title "Hikari S $VERSION" --notes "$NOTES"
            else
              gh release create "$TAG" hikari-s.apk hikari-s-arm64-v8a.apk hikari-s-armeabi-v7a.apk --repo "$GITHUB_REPOSITORY" \
                --title "Hikari S $VERSION" --notes "$NOTES"
            fi
          fi
          for expected in hikari-s.apk hikari-s-arm64-v8a.apk hikari-s-armeabi-v7a.apk; do
            if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq "$expected"; then
              echo "::error::Expected signed APK asset $expected is missing from release $TAG."
              exit 1
            fi
          done
          # Give each file a readable name on the releases page. GitHub shows an
          # asset's `label` INSTEAD of its file name, so "hikari-s.apk" reads as
          # "Hikari Android & TV Universal" while the download URL keeps the
          # file name the in-app updater and every existing link already use.
          REL_ID=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .id 2>/dev/null || true)
          if [ -n "$REL_ID" ]; then
            for spec in \
              "hikari-s.apk=Hikari Android & TV Universal" \
              "hikari-s-arm64-v8a.apk=Hikari Android & TV 64-bit (arm64-v8a)" \
              "hikari-s-armeabi-v7a.apk=Hikari Android & TV 32-bit (armeabi-v7a)"
            do
              FILE="${spec%%=*}"
              LABEL="${spec#*=}"
              ASSET_ID=$(gh api "repos/$GITHUB_REPOSITORY/releases/$REL_ID/assets" \
                --jq ".[] | select(.name==\"$FILE\") | .id" 2>/dev/null | head -n1 || true)
              if [ -n "$ASSET_ID" ]; then
                gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID" \
                  -f label="$LABEL" --jq '"asset label: " + .name + " -> " + .label' || true
              fi
            done
          fi
